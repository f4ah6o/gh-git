name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          printf '%s\\n' "$files"
          if [ -n "$files" ]; then gofmt -d $files; exit 1; fi
      - name: test
        run: go test ./...
      - name: vet
        run: go vet ./...
